{{- if and .Values.metricsServer.enabled .Values.networkPolicy.enabled (eq .Values.networkPolicy.flavor "kubernetes") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.operator.name }}-metrics-apiserver
  namespace: {{ .Release.Namespace }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ .Values.operator.name }}-metrics-apiserver
    app.kubernetes.io/name: {{ .Values.operator.name }}-metrics-apiserver
    {{- include "keda.labels" . | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.operator.name }}-metrics-apiserver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress on the HTTPS metrics API port from any source including
    # the Kubernetes control plane (aggregated APIService health checks).
    # No `from` selector -- on managed platforms (EKS Auto Mode, GKE) the
    # control plane uses ENI IPs that don't match namespaceSelector.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.portHttpsTarget }}
    {{- if .Values.prometheus.metricServer.enabled }}
    # Allow ingress from any pod in the cluster on the prometheus metrics port
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.prometheus.metricServer.port }}
    {{- end }}
    {{- if .Values.profiling.metricsServer.enabled }}
    # Allow ingress from any pod in the cluster on the profiling port
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.profiling.metricsServer.port }}
    {{- end }}
  egress:
    # Allow DNS resolution. Uses a plain port rule without a podSelector
    # for compatibility with node-local DNS (e.g. EKS Auto Mode) where
    # the resolver is not a pod labeled k8s-app=kube-dns.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to Kubernetes API server
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow egress to KEDA operator for gRPC metrics service
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Values.operator.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.operator.metricsServiceTargetPort }}
    # Allow egress to any pod in the cluster for metric collection
    - to:
        - namespaceSelector: {}
    {{- if .Values.networkPolicy.kubernetes.metricsServer.extraEgressRules }}
    {{ toYaml .Values.networkPolicy.kubernetes.metricsServer.extraEgressRules | nindent 4 }}
    {{- end }}
{{- end }}
