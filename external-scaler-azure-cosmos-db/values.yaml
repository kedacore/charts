# -- Additional labels that should be applied to all resources
additionalLabels: {}
#  name: <value>

# Docker image configuration.
image:
  # -- The Docker image repository to use for Azure Cosmos DB external scaler
  repository: ghcr.io/kedacore/external-scaler-azure-cosmos-db
  # -- The Docker image tag to use for Azure Cosmos DB external scaler
  tag: 0.1.0
  # -- The image pull policy for Azure Cosmos DB external scaler
  pullPolicy: Always

# -- The incoming port for 'Azure Cosmos DB external scaler' service
port: 4050

# Container resource requests and limits.
resources:
  # -- The CPU/memory resource request for the 'Azure Cosmos DB external scaler' pod
  requests:
    cpu: 10m
    memory: 128Mi
  # -- The CPU/memory resource limit for the 'Azure Cosmos DB external scaler' pod
  limits:
    cpu: 100m
    memory: 512Mi

# -- Node selector for the 'Azure Cosmos DB external scaler' pod
nodeSelector: {}

# -- Tolerations for the 'Azure Cosmos DB external scaler' pod
tolerations: []

# -- Affinity for the 'Azure Cosmos DB external scaler' pod
affinity: {}

serviceAccount:
  # -- Whether to create a ServiceAccount for the 'Azure Cosmos DB external scaler'
  create: true
  # -- Name of the ServiceAccount; defaults to the chart name
  name: ""
  # -- Annotations for the ServiceAccount (e.g. azure.workload.identity/client-id)
  annotations: {}
